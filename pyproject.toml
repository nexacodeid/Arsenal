[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-arsenal"
dynamic = ["version"]
description = "Interactive installer for bug bounty tooling, tuned for Termux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]
keywords = ["bug-bounty", "security", "recon", "termux", "installer", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
bb-arsenal = "bb_arsenal.cli:main"
bb-recon = "bb_arsenal.recon.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/bb-arsenal"
Issues = "https://github.com/your-username/bb-arsenal/issues"

[tool.setuptools.dynamic]
version = { attr = "bb_arsenal.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bb_arsenal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP035", "UP007", "UP045"]
